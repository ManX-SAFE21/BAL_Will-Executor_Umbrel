# =============================================================================
# Rate limiting (DoS hardening) — mirrors upstream bal-server 0.3.0 limits:
#   pushtxs  1 req/s  burst 3   |  searchtx  5 req/s  burst 10
#
# Clients reach us through the Cloudflare tunnel, so $remote_addr is always
# the cloudflared container IP — useless as a limiting key. Cloudflare's edge
# sets CF-Connecting-IP to the real client address, so we key on that and
# fall back to the direct peer address for local/non-CF traffic (e.g. onion).
# =============================================================================
map $http_cf_connecting_ip $ratelimit_key {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}

limit_req_zone $ratelimit_key zone=bal_pushtxs:10m rate=1r/s;
limit_req_zone $ratelimit_key zone=bal_searchtx:10m rate=5r/s;
# txlist is reachable from the public domain (read-only transaction list), so it
# needs its own brake. The dashboard fires a handful of these per page load.
limit_req_zone $ratelimit_key zone=bal_txlist:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 512k;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = /index.html {
        charset utf-8;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    location ~ ^/(api/)?(settings|restart-server)$ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        set $block "";
        if ($http_host = "we.safe21.io") {
            set $block "1";
        }
        if ($http_host ~* "\.onion$") {
            set $block "1";
        }
        if ($request_method != GET) {
            set $block "${block}2";
        }
        if ($block = "12") {
            add_header Access-Control-Allow-Origin "*" always;
            return 403;
        }

        set $backend_uri $uri;
        if ($uri ~ ^/api/(.*)$) {
            set $backend_uri /$1;
        }
        proxy_pass         http://bal-server:9137$backend_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;
    }

    # Transaction list — PUBLIC (read-only). Returns txid, network, fee, status,
    # locktime and creation date only: no raw transaction, no beneficiary
    # addresses or amounts (those live in txdetail, blocked below). The handler
    # binds its parameters, picks ORDER BY from a whitelist, filters the search
    # term to hex, and clamps limit to 200 — so this is a bounded read. Rate
    # limited because it faces the internet.
    location ~ ^/(api/)?txlist$ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        limit_req zone=bal_txlist burst=20 nodelay;
        limit_req_status 429;
        set $backend_uri $uri;
        if ($uri ~ ^/api/(.*)$) {
            set $backend_uri /$1;
        }
        proxy_pass         http://bal-server:9137$backend_uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;
    }

    # Transaction detail — NOT public. `SELECT *` including the raw signed
    # transaction, plus input/output addresses and amounts: publishing that
    # would expose who inherits how much, and when, before the will matures.
    location ~ ^/(api/)?txdetail$ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        set $block "";
        if ($http_host = "we.safe21.io") {
            set $block "1";
        }
        if ($block = "1") {
            add_header Access-Control-Allow-Origin "*" always;
            return 403;
        }
        set $backend_uri $uri;
        if ($uri ~ ^/api/(.*)$) {
            set $backend_uri /$1;
        }
        proxy_pass         http://bal-server:9137$backend_uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;
    }

    # Will-submission endpoint (public POST) — strictest limit, as upstream.
    location ~ ^/(bitcoin|testnet|testnet4|signet|regtest)/pushtxs$ {
        limit_req zone=bal_pushtxs burst=3 nodelay;
        limit_req_status 429;
        rewrite ^ $uri break;
        proxy_pass         http://bal-server:9137;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;
    }

    location ~ ^/(bitcoin|testnet|testnet4|signet|regtest)/(info|stats)$ {
        rewrite ^ $uri break;
        proxy_pass         http://bal-server:9137;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;
    }

    # ADMIN — never reachable from the public domain or Tor.
    # /backup streams the WHOLE SQLite database (raw signed transactions,
    # beneficiary addresses and amounts); /merge writes arbitrary rows into it.
    # Both were exposed on we.safe21.io until 21 Sep 2026 — see AGENTS.md.
    location ~ ^/(api/)?(backup|merge)$ {
        set $block "";
        if ($http_host = "we.safe21.io") {
            set $block "1";
        }
        if ($http_host ~* "\.onion$") {
            set $block "1";
        }
        if ($block = "1") {
            add_header Access-Control-Allow-Origin "*" always;
            return 403;
        }
        client_max_body_size 500M;
        set $backend_uri $uri;
        if ($uri ~ ^/api/(.*)$) {
            set $backend_uri /$1;
        }
        proxy_pass         http://bal-server:9137$backend_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # Tx status lookup (public POST) — limited, as upstream.
    location ~ ^/searchtx$ {
        limit_req zone=bal_searchtx burst=10 nodelay;
        limit_req_status 429;
        rewrite ^ $uri break;
        proxy_pass         http://bal-server:9137;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;
    }

    location ~ ^/(version|\.pub_key\.pem)$ {
        rewrite ^ $uri break;
        proxy_pass         http://bal-server:9137;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;
    }

    # ADMIN (continued) — these used to fall through to the catch-all below and
    # were therefore reachable from the public domain: /restore overwrites the
    # database from a named backup, /backups/list and /backup/config disclose
    # the backup layout, and the logo endpoints let anyone rebrand the site.
    # A 405 on these from a GET probe is NOT protection — it means nginx
    # forwarded the request and only the method was refused.
    location ~ ^/(api/)?(backups/list|backup/config|restore/.+|upload-logo|remove-logo)$ {
        set $block "";
        if ($http_host = "we.safe21.io") {
            set $block "1";
        }
        if ($http_host ~* "\.onion$") {
            set $block "1";
        }
        if ($block = "1") {
            add_header Access-Control-Allow-Origin "*" always;
            return 403;
        }
        set $backend_uri $uri;
        if ($uri ~ ^/api/(.*)$) {
            set $backend_uri /$1;
        }
        proxy_pass         http://bal-server:9137$backend_uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://bal-server:9137;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;
    }

    location /tor-address.json {
        root /usr/share/nginx/html;
        add_header Content-Type application/json;
        try_files /tor-address.json =200;
        default_type application/json;
    }

    location = /zmq-status.json {
        add_header Content-Type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        default_type application/json;
        root /app-data;
        try_files /zmq-status.json @zmq_pending;
    }

    location @zmq_pending {
        default_type application/json;
        return 200 '{"status":"pending"}';
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
