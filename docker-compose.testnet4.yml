# =============================================================================
# Testnet4 companion stack for the App Store install (safe21-will-executor)
# =============================================================================
# The App Store app watches Bitcoin mainnet only. This small manual stack adds
# testnet4 next to it: its own bitcoind (testnet4, txindex) and a bal-pusher
# for testnet4 that writes into the app's database and reports to welist with
# the app's key. The app's server serves /testnet4/* once data/app.env holds
# BAL_SERVER_TESTNET4_ADDRESS (and _FIXED_FEE).
#
# Deployed as docker-compose.yml in /home/umbrel/umbrel/app-data/bal-umbrel/
# bal-umbrel (project name "bal-umbrel", same as the old full stack, so the
# testnet4 node container and its networks are reused unchanged) and started
# at boot by the custom pre-start hook.
#
# Uses the image bal-umbrel-rust:latest built on the device by the old stack.
# =============================================================================

services:

  bitcoind-testnet4:
    image: bitcoin/bitcoin:29.5@sha256:97b2ae3833880760b36481cba435de7b6f32218bc8eb6aaa5ac321d9591b9ae4
    container_name: bal-umbrel-bitcoind-testnet4
    restart: unless-stopped
    command:
      - bitcoind
      - -testnet4=1
      - -server=1
      - -listen=0
      - -txindex=1
      - -dbcache=300
      - -maxmempool=100
      - -nodebuglogfile=1
      - -rpcbind=0.0.0.0:48332
      - -rpcallowip=10.77.4.0/24
      - -zmqpubhashblock=tcp://0.0.0.0:24332
    volumes:
      - ${APP_DATA_DIR:-.}/bitcoin-testnet4:/home/bitcoin/.bitcoin
    networks:
      - bal-testnet4
    mem_limit: 2g
    cpus: 1.5
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bal-pusher-testnet4:
    image: bal-umbrel-rust:latest
    container_name: bal-umbrel-pusher-testnet4
    restart: unless-stopped
    depends_on:
      - bitcoind-testnet4
    command: ["/usr/local/bin/bal-pusher", "testnet4"]
    environment:
      - BAL_PUSHER_DB_FILE=/data/bal.db
      - BAL_PUSHER_TESTNET4_HOST=http://bitcoind-testnet4
      - BAL_PUSHER_TESTNET4_PORT=48332
      - BAL_PUSHER_TESTNET4_COOKIE_FILE=/bitcoin-testnet4/testnet4/.cookie
      - BAL_PUSHER_TESTNET4_ZMQ_HASHBLOCK=tcp://bitcoind-testnet4:24332
      - SSL_KEY_PATH=/data/keys/private_key.pem
      - BAL_PUSHER_SEND_STATS=${BAL_SEND_STATS:-false}
      - BAL_SERVER_URL=${BAL_PUBLIC_URL:-}
      - RUST_LOG=${BAL_LOG_LEVEL:-info}
    volumes:
      # The App Store app's data: same database and welist key as mainnet.
      - ${BAL_APP_DATA_DIR:-/home/umbrel/umbrel/app-data/safe21-will-executor/data}:/data
      - ${APP_DATA_DIR:-.}/bitcoin-testnet4:/bitcoin-testnet4:ro
    networks:
      - bal-testnet4
      - bal-v6

networks:
  bal-v6:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:ba1:e21::/64

  bal-testnet4:
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.4.0/24
